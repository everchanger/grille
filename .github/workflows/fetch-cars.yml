name: Fetch Car Data

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of cars to generate (default: 500)'
        required: false
        default: '500'
        type: string
      skip_images:
        description: 'Skip downloading images (for faster testing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      CAR_LIMIT: ${{ inputs.limit }}
    steps:
      - name: Validate inputs
        run: |
          if ! echo "$CAR_LIMIT" | grep -qE '^[0-9]+$'; then
            echo "::error::limit must be a positive integer, got: $CAR_LIMIT"
            exit 1
          fi
          if [ "$CAR_LIMIT" -lt 1 ] || [ "$CAR_LIMIT" -gt 1000 ]; then
            echo "::error::limit must be between 1 and 1000, got: $CAR_LIMIT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Build car dataset
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.skip_images }}" = "true" ]; then
            EXTRA_ARGS="--skip-images"
          fi
          python scripts/fetch-cars.py $EXTRA_ARGS "$CAR_LIMIT" 2>&1 | tee /tmp/fetch-output.txt

      - name: Verify output
        run: |
          if [ ! -f data/cars.json ]; then
            echo "::error::No output file generated"
            exit 1
          fi
          COUNT=$(python -c "import json; print(len(json.load(open('data/cars.json'))))")
          echo "Generated $COUNT cars"
          if [ "$COUNT" -lt 365 ]; then
            echo "::error::Expected at least 365 cars, got $COUNT"
            exit 1
          fi
          echo "car_count=$COUNT" >> "$GITHUB_ENV"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'data: update car dataset (${{ env.car_count }} cars)'
          title: 'Update car dataset (${{ env.car_count }} cars)'
          body: |
            ## Auto-generated car dataset

            This PR was created by the **Fetch Car Data** workflow.

            - **Source:** Curated seed data enriched with Wikipedia images and facts
            - **Car count:** ${{ env.car_count }}
            - **Images:** Downloaded from Wikipedia and converted to `.webp`
            - **Facts:** Preserved from existing data or extracted from Wikipedia

            This PR is **ready to merge** — no manual steps required.
          branch: data/update-car-dataset
          delete-branch: true
          labels: data
